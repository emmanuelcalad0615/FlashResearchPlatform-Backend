name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: flash
          POSTGRES_PASSWORD: flash_test_pw
          POSTGRES_DB: flash_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U flash"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql://flash:flash_test_pw@localhost:5432/flash_test
      # Misma base: en CI es efimera, se crea y se tira con el job.
      TEST_DATABASE_URL: postgresql://flash:flash_test_pw@localhost:5432/flash_test
      REDIS_URL: redis://localhost:6379/0
      # Valor de usar y tirar: el CI no firma nada que salga de aqui.
      JWT_SECRET: ci-only-not-a-real-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      # Las migraciones tienen dos direcciones y solo se probaba una. Un
      # downgrade roto se descubriria el dia que haya que revertir un
      # despliegue, con el sistema caido.
      - name: migrations run forward and back
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # -m "" incluye los de integracion, que addopts excluye por defecto.
      # Sin esto el pipeline no ejecutaba ni uno.
      - name: tests with coverage
        run: uv run pytest -m "" --cov=apps --cov=packages --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
