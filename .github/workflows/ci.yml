name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: flash
          POSTGRES_PASSWORD: flash_test_pw
          POSTGRES_DB: flash_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U flash"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql://flash:flash_test_pw@localhost:5432/flash_test
      # Misma base: en CI es efimera, se crea y se tira con el job.
      TEST_DATABASE_URL: postgresql://flash:flash_test_pw@localhost:5432/flash_test
      REDIS_URL: redis://localhost:6379/0
      # Valor de usar y tirar: el CI no firma nada que salga de aqui.
      JWT_SECRET: ci-only-not-a-real-secret-at-least-32-bytes-long
      # El runner es un entorno de DESARROLLO: no hay TLS ni servidor de correo
      # real. Sin esto, `debug` toma su valor por defecto (false) y la guarda de
      # arranque exige credenciales SMTP, con razon: con DEBUG=false el correo
      # viajaria sin cifrar. Como Settings() se construye al importar, la
      # excepcion rompe la RECOLECCION de los tests, no uno concreto: 20
      # archivos fallan antes de ejecutar nada.
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .

      # Antes de las migraciones: no necesita base de datos, y si el contrato
      # esta desincronizado conviene decirlo con ese nombre y no como un test
      # rojo entre otros veinte.
      - name: Contrato OpenAPI sincronizado
        run: uv run python scripts/export_openapi.py --check

      # Las migraciones tienen dos direcciones y solo se probaba una. Un
      # downgrade roto se descubriria el dia que haya que revertir un
      # despliegue, con el sistema caido.
      - name: migrations run forward and back
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # -m "" incluye los de integracion, que addopts excluye por defecto.
      # Sin esto el pipeline no ejecutaba ni uno.
      - name: tests with coverage
        run: uv run pytest -m "" --cov=apps --cov=packages --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ---------------------------------------------------------------------
  # Analisis estatico en SonarQube Cloud
  # ---------------------------------------------------------------------
  # Corre DESPUES de lint-test, y solo si paso: analizar un commit cuyos tests
  # fallan mide codigo que nadie va a mergear, y ademas el coverage.xml podria
  # estar a medias.
  sonar:
    needs: lint-test
    runs-on: ubuntu-latest
    # Sin el secreto configurado el job se salta en vez de fallar. Asi un fork
    # o un clon sin acceso a Sonar no ve el pipeline en rojo por algo que no
    # puede arreglar.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar necesita la historia completa para atribuir cada linea a su
          # commit y su autor. Con el clon superficial por defecto, el "codigo
          # nuevo" que evalua la Quality Gate sale mal calculado.
          fetch-depth: 0

      # El coverage.xml lo produjo el job anterior. Se recupera en vez de
      # volver a correr los tests: mismo resultado, la mitad de tiempo, y sin
      # riesgo de que las dos ejecuciones difieran.
      - uses: actions/download-artifact@v4
        with:
          name: coverage

      # v6 y no v4: la v4 esta fuera de soporte y GitHub la marca con una
      # vulnerabilidad conocida. Un workflow corre con acceso a los secretos
      # del repositorio, asi que una accion comprometida los ve todos.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Espera el veredicto de la Quality Gate y falla el job si no pasa.
      # Sin este paso el analisis se sube pero el pipeline queda verde aunque
      # la cobertura baje: el informe existiria y no protegeria de nada.
      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
