[project]
name = "flash-research-api"
version = "0.1.0"
description = "Flash Research Platform — backend API and worker"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.137.2",
    # El metadata de SQLAlchemy condiciona greenlet a un marker de
    # platform_machine que no incluye macOS arm64 (Apple Silicon), asi que
    # `uv sync` lo omite ahi aunque AsyncSession lo necesite en runtime.
    # Se declara directo para evitar ese hueco.
    "greenlet>=3.5.2",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pysonar>=1.8.0.5390",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.1",
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Los tests de integracion quedan FUERA por defecto: `uv run pytest` sigue
# siendo rapido y sin dependencias. Para correrlos: `uv run pytest -m integration`
addopts = "-m 'not integration'"
markers = [
    "integration: necesita Postgres levantado y TEST_DATABASE_URL definida",
]
