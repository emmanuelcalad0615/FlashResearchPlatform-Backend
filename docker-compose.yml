services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: flash_db
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash_dev_pw
      POSTGRES_DB: flash_research
    ports:
      - "5432:5432"
    volumes:
      - flash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash_research"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash_redis
    ports:
      - "6379:6379"
    volumes:
      - flash_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Servidor de correo FALSO, solo para desarrollo. Atrapa los correos que
  # manda la API y los muestra en una bandeja web; no reenvia nada a internet.
  #   - puerto 1025: por donde la API le entrega los correos (SMTP)
  #   - puerto 8025: la bandeja de entrada, en el navegador
  # Nunca se despliega en produccion: alli va un proveedor SMTP real.
  mailpit:
    image: axllent/mailpit:latest
    container_name: flash_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  flash_db_data:
  flash_redis_data:
