# Configuración del análisis de SonarQube — backend (Python).
#
# ESTE ARCHIVO SE VERSIONA. Contiene qué se analiza y qué se excluye, que no es
# secreto y sí tiene que ser idéntico en tu máquina y en el CI: si viviera solo
# en local, el runner de GitHub no lo tendría y analizaría otra cosa.
#
# Lo que NO va aquí son las dos cosas que cambian según dónde corra:
#
#   SONAR_TOKEN      la credencial. En local la exportas tú; en GitHub sale del
#                    secreto del repositorio.
#   SONAR_HOST_URL   http://localhost:9000 en tu máquina,
#                    https://sonarcloud.io en el CI.
#
# El scanner lee las dos del entorno, sin que haya que nombrarlas aquí.
#
# Para correrlo en local:
#
#   export SONAR_HOST_URL=http://localhost:9000
#   export SONAR_TOKEN=<tu-token-local>
#   uv run pytest -m "" --cov=apps --cov=packages --cov-report=xml
#   sonar-scanner
#
# OJO con el `-m ""` del pytest: sin él quedan fuera los tests de integración y
# la cobertura que lee Sonar sale mucho más baja de la real.

# ⚠️ Debe coincidir EXACTAMENTE con la key del proyecto creado en SonarQube.
# Si no coincide, Sonar crea un proyecto nuevo y vacío en vez de llenar el tuyo.
# La ves en Project Information o en la URL: /dashboard?id=<KEY>
# La key la genera SonarQube Cloud al importar el repo, con la forma
# <organizacion>_<repo>. NO se inventa: si no coincide exactamente, el scanner
# crea un proyecto nuevo y vacio en vez de llenar el que existe.
sonar.projectKey=emmanuelcalad0615_FlashResearchPlatform-Backend

# Obligatoria en SonarQube Cloud; el SonarQube local la ignora. Sin ella el
# analisis del CI falla con "Organization key is required".
sonar.organization=emmanuelcalad0615
sonar.projectName=Flash Research API
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------
# Qué se analiza
# ------------------------------------------------------------------
# Código de producción: la API, el worker y el paquete compartido.
# scripts/ queda fuera: son utilidades que se ejecutan a mano contra APIs
# reales (smoke tests del proveedor), no código de producción. Incluirlas
# solo añadiría lineas sin cubrir al denominador de la cobertura.
sonar.sources=apps,packages

# Aquí los tests SÍ viven en su propia carpeta, así que no hace falta
# test.inclusions para separarlos del código de producción.
sonar.tests=tests

# Versiones de Python soportadas (pyproject declara >=3.12; el venv usa 3.13).
# Sonar las usa para saber qué sintaxis y qué reglas aplicar.
sonar.python.version=3.12,3.13

# ------------------------------------------------------------------
# Fuera del análisis
# ------------------------------------------------------------------
# .venv          → dependencias de terceros, no es código nuestro
# __pycache__    → bytecode generado
# migrations/versions → registro histórico inmutable: una migración ya aplicada
#                       no se corrige, se sustituye por otra. Los hallazgos ahí
#                       no son accionables. (Quita esta línea si prefieres
#                       analizar también el SQL.)
sonar.exclusions=\
  .venv/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  migrations/versions/**,\
  Personales/**

# Los fixtures son respuestas crudas guardadas del proveedor, no código.
sonar.test.exclusions=tests/fixtures/**

# ------------------------------------------------------------------
# Reglas silenciadas, con su justificación
# ------------------------------------------------------------------
# python:S7503 — "Use asynchronous features in this function or remove the
# `async` keyword". No aplica a los handlers de excepción:
#
#   1. Starlette inspecciona la firma. Si el handler NO es async, lo ejecuta
#      con run_in_threadpool: reserva un hilo del sistema para código que no
#      bloquea nada. Quitar el async lo haría más lento, no más rápido.
#   2. middleware.py llama a unhandled_exception_handler con `await` directo,
#      para que la respuesta del 500 se construya por dentro de CORSMiddleware.
#      Sin async, esa línea revienta y la app no arranca.
#
# La regla es correcta en general: sigue activa para el resto del código.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/api/infrastructure/middlewares/error_handlers.py

# e2 — misma regla, en get_access_claims.
#
# La dependencia es `async def` y no espera nada dentro. Es deliberado: FastAPI
# ejecuta las dependencias SINCRONAS en un threadpool y las asincronas en el
# event loop. Quitar el `async` mandaria a un hilo aparte una funcion que solo
# lee una cookie y verifica una firma, en CADA peticion autenticada: mas lento,
# no mas limpio.
#
# Se excluye por regla y por archivo, y no con `# NOSONAR`: en Python ese
# comentario apaga TODAS las reglas de la linea, incluida cualquier regla de
# seguridad futura sobre la lectura de la cookie.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/api/dependencies.py

# ------------------------------------------------------------------
# Cobertura
# ------------------------------------------------------------------
# Requiere pytest-cov y generar el informe antes de escanear:
#   uv run pytest --cov=apps --cov=packages --cov-report=xml
# Sin ese archivo, Sonar reporta 0% de cobertura.
sonar.python.coverage.reportPaths=coverage.xml

# Informe de ruff, si algún día se exporta en formato genérico.
# sonar.python.ruff.reportPaths=ruff-report.json
